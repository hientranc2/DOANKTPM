services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clothify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ecommerce-network

  backend:
    build: ./backend
    environment:
      PORT: 4000
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-clothify}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123123}
      JWT_SECRET: ${JWT_SECRET:-secret_ecom}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_started
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - ecommerce-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ecommerce-network
    environment:
      NODE_ENV: production

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ecommerce-network
    environment:
      NODE_ENV: production

volumes:
  pgdata:


networks:
  ecommerce-network:
    driver: bridge
